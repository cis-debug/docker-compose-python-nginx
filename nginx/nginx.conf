# Nginx minimal en reverse proxy vers l'API Python
events {}

http {
  server {
    listen 80;

    # Toutes les requêtes /api/* sont envoyées vers le service "api"
    location /api/ {
      proxy_pass http://api:5000;

      # Headers utiles
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Route simple pour vérifier Nginx lui-même
    location / {
      return 200 "Nginx is running. Try /api/health or /api/info\n";
      add_header Content-Type text/plain;
    }
  }
}
